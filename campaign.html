<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRADA 캠페인 관리</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="prada.css?v=20261030s">
<style>
/* =========================================================
   4. 화면 — 캠페인 관리 (목록 템플릿·컴포넌트는 prada.css)
   ========================================================= */
/* 검색 줄: [등록일 140 📅] [Dropdown 140] [Search Field 410], 간격 8 */
.campaign-search .input-icon { flex: none; width: 140px; }
/* 표: 상품명(남는 폭, Label 2/SemiBold) · 할당량·소진 횟수·남은 횟수·오답수·등록일 100 · 광고 노출·정답 수정 80 */
.campaign-table .col-100 { width: 100px; }
.campaign-table .col-80 { width: 80px; }
.campaign-table td.col-name { font-weight: 600; }
.campaign-table td.col-80 { line-height: 0; }

/* 정답 수정 (Modal / Dialog 360) */
.dialog--answer { width: 360px; }
.answer-help { margin-top: 12px; color: var(--text-subtle); }

@media (max-width: 767px) {
  /* 모바일 시안: 등록일 140 한 줄 → [Dropdown][Search] 한 줄, 상품명 왼쪽 정렬 */
  .campaign-search { flex-wrap: wrap; }
  .campaign-search .input-icon { margin-right: 100%; }
  .campaign-search .search-field { flex: 1; }
  .campaign-table .col-name { width: 400px; }
  .campaign-table td.col-name { text-align: left; }
}
</style>
</head>
<body data-prada-page="campaign.html">

<div class="app-body">
  <main class="main">
    <div class="page-header">
      <h1 class="heading-1-semibold">캠페인 관리</h1>
      <p class="page-header__desc label-1-regular">작업서버에 등록된 캠페인을 관리할 수 있습니다.</p>
    </div>
    <div class="view" id="view"></div>
  </main>
</div>

<!-- 정답 수정 (Modal / Dialog 360) -->
<div class="modal" id="answerModal" hidden>
  <form class="dialog dialog--answer" id="answerForm" role="dialog" aria-modal="true" aria-labelledby="answerTitle" tabindex="-1" novalidate>
    <h2 class="dialog__header body-1-semibold" id="answerTitle">정답 수정</h2>
    <div>
      <input class="text-input label-1-regular" id="answerInput" name="answer" placeholder="정답을 입력해주세요." aria-label="정답" aria-describedby="answerHelp">
      <p class="answer-help label-2-regular" id="answerHelp">저장을 누르면 즉시 반영됩니다.</p>
    </div>
    <div class="cta">
      <button class="btn btn--md btn--line" type="button" data-answer-close>취소</button>
      <button class="btn btn--md btn--primary" type="submit">저장</button>
    </div>
    <button class="dialog__close" type="button" aria-label="닫기" data-answer-close><svg width="20" height="20"><use href="#i-close"/></svg></button>
  </form>
</div>

<script src="prada.js?v=20261030s"></script>
<script src="campaign-data.js?v=20261030s"></script>
<script>
(() => {
  const { esc, icon, showToast, setInputError, clearInputError, syncScrollBtn, mountSelect, searchBarHTML, syncSearchClear, listNavHTML } = Prada;
  const { campaigns } = CampaignData;   // campaign-data.js

  const state = { date: '', page: 1, pageSize: 50, field: 'all', query: '' };
  const FIELDS = { product: '상품명', answer: '정답' };
  const view = document.getElementById('view');

  function filtered() {
    const q = state.query.trim().toLowerCase();
    return campaigns.filter((c) => (!state.date || c.created === state.date) &&
      (!q || (state.field === 'all' ? Object.keys(FIELDS) : [state.field]).some((k) => c[k].toLowerCase().includes(q))));
  }

  function renderList() {
    const rows = filtered();
    const totalPages = Math.max(1, Math.ceil(rows.length / state.pageSize));
    state.page = Math.min(state.page, totalPages);
    const pageRows = rows.slice((state.page - 1) * state.pageSize, state.page * state.pageSize);

    // 검색 바 앞에 등록일(하루) 선택을 붙인다
    view.innerHTML = `
      ${searchBarHTML(state.query).replace('<div class="search">', `<div class="search campaign-search">
        <span class="input-icon">
          <input class="text-input label-1-regular" id="dateInput" value="${state.date}" placeholder="연도. 월. 일" aria-label="등록일" inputmode="numeric" maxlength="10">
          <button class="input-icon__btn" type="button" data-pick aria-label="등록일 달력 열기">${icon('i-calendar')}</button>
          <input class="input-icon__native" type="date" tabindex="-1" aria-hidden="true" data-native>
        </span>`)}
      <div class="list-block">
        <div class="table-scroll">
          <table class="table campaign-table">
            <thead><tr>
              <th class="col-name">상품명</th>
              <th class="col-100">할당량</th><th class="col-100">소진 횟수</th><th class="col-100">남은 횟수</th><th class="col-100">오답수</th><th class="col-100">등록일</th>
              <th class="col-80">광고 노출</th><th class="col-80">정답 수정</th>
            </tr></thead>
            <tbody>
              ${pageRows.length ? pageRows.map((c) => `
                <tr>
                  <td class="col-name">${esc(c.product)}</td>
                  <td>${c.quota.toLocaleString()}</td><td>${c.used.toLocaleString()}</td><td>${(c.quota - c.used).toLocaleString()}</td>
                  <td>${c.wrong.toLocaleString()}</td><td>${c.created}</td>
                  <td class="col-80"><button class="toggle" type="button" role="switch" aria-checked="${c.on}" data-toggle="${c.id}" aria-label="${esc(c.product)} 광고 노출"></button></td>
                  <td class="col-80"><button class="cell-icon-btn" type="button" data-answer="${c.id}" aria-label="${esc(c.product)} 정답 수정">${icon('i-settings')}</button></td>
                </tr>`).join('') : '<tr><td class="table__empty" colspan="8">검색 결과가 없습니다.</td></tr>'}
            </tbody>
          </table>
        </div>
      </div>
      ${listNavHTML(state.page, totalPages)}`;

    mountSelect(view.querySelector('[data-select="field"]'),
      [{ value: 'all', label: '전체' }, ...Object.entries(FIELDS).map(([value, label]) => ({ value, label }))],
      state.field, (v) => { state.field = v; });
    mountSelect(view.querySelector('[data-select="size"]'),
      [10, 30, 50].map((n) => ({ value: String(n), label: `${n}개씩 보기` })),
      String(state.pageSize), (v) => { state.pageSize = Number(v); state.page = 1; renderList(); });
    syncScrollBtn();
  }

  /* ---------------- 등록일 (하루) ---------------- */
  function applyDate(v) {
    const el = view.querySelector('#dateInput');
    clearInputError(el);
    const ok = v === '' || (/^\d{4}-\d{2}-\d{2}$/.test(v) && Prada.period.ymd(new Date(`${v}T00:00:00`)) === v);
    if (!ok) { setInputError(el, '날짜 형식을 확인해주세요.'); return; }
    if (v !== state.date) { state.date = v; state.page = 1; renderList(); }
  }
  view.addEventListener('change', (e) => {
    if (e.target.matches('[data-native]') && e.target.value) { view.querySelector('#dateInput').value = e.target.value; applyDate(e.target.value); }
    else if (e.target.id === 'dateInput') applyDate(e.target.value.trim().replace(/\.\s*/g, '-').replace(/-$/, ''));
  });
  view.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && e.target.id === 'dateInput') { e.preventDefault(); applyDate(e.target.value.trim().replace(/\.\s*/g, '-').replace(/-$/, '')); }
  });

  /* ---------------- 광고 노출 ON/OFF (확인 → 토스트) ---------------- */
  async function toggleAd(c) {
    const next = !c.on;
    const ok = await Prada.confirm({ title: `광고를 ${next ? 'ON' : 'OFF'} 하시겠습니까?`, okText: '확인' });
    if (!ok) return;
    c.on = next;
    const sw = view.querySelector(`[data-toggle="${c.id}"]`);
    if (sw) { sw.setAttribute('aria-checked', String(next)); sw.focus({ preventScroll: true }); }   // 다시 그리지 않아 손잡이가 200ms로 이동
    showToast('success', `광고를 ${next ? 'ON' : 'OFF'} 하였습니다.`);
  }

  view.addEventListener('click', (e) => {
    if (e.target.closest('#searchClear')) {
      view.querySelector('#searchInput').value = '';
      if (state.query) { state.query = ''; state.page = 1; renderList(); } else syncSearchClear();
      view.querySelector('#searchInput').focus();
      return;
    }
    if (e.target.closest('[data-pick]')) {
      const native = view.querySelector('[data-native]');
      native.value = state.date;
      try { native.showPicker(); } catch (err) { native.focus(); native.click(); }
      return;
    }
    const pageBtn = e.target.closest('.pagination [data-page]');
    if (pageBtn && !pageBtn.disabled) { state.page = Number(pageBtn.dataset.page); renderList(); return; }
    const tg = e.target.closest('[data-toggle]');
    if (tg) { toggleAd(campaigns.find((c) => c.id === Number(tg.dataset.toggle))); return; }
    const ans = e.target.closest('[data-answer]');
    if (ans) openAnswer(campaigns.find((c) => c.id === Number(ans.dataset.answer)));
  });
  view.addEventListener('submit', (e) => {
    e.preventDefault();
    if (e.target.id === 'searchForm') {
      state.query = view.querySelector('#searchInput').value; state.page = 1; renderList();
    } else if (e.target.id === 'gotoForm') {
      const total = Math.max(1, Math.ceil(filtered().length / state.pageSize));
      const p = parseInt(view.querySelector('#gotoInput').value, 10);
      state.page = Number.isFinite(p) ? Math.min(Math.max(p, 1), total) : state.page;
      renderList();
    }
  });

  /* ---------------- 정답 수정 (Modal / Dialog 360) ---------------- */
  const answerModal = document.getElementById('answerModal');
  const answerForm = document.getElementById('answerForm');
  const answerInput = document.getElementById('answerInput');
  let target = null;
  function openAnswer(c) {
    target = c;
    answerInput.value = c.answer;
    clearInputError(answerInput);
    answerModal.hidden = false;
    answerForm.focus();
  }
  function closeAnswer() { answerModal.hidden = true; }
  answerModal.addEventListener('click', (e) => { if (e.target === answerModal || e.target.closest('[data-answer-close]')) closeAnswer(); });
  answerInput.addEventListener('input', () => clearInputError(answerInput));
  answerForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const v = answerInput.value.trim();
    if (!v) { setInputError(answerInput, '정답을 입력해주세요.'); answerInput.focus(); return; }
    target.answer = v;
    closeAnswer();
    showToast('success', '정답 수정이 완료되었습니다.');
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeAnswer(); });

  renderList();
  view.classList.add('is-entering');   // 화면 진입 페이드
})();
</script>
</body>
</html>
